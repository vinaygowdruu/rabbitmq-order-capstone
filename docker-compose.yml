services:
  rabbit1:
    image: rabbitmq:4.1-management
    hostname: rabbit1
    environment: &rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-capstone-shared-erlang-cookie-change-this}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-capstone}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-capstone-dev-password}
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  rabbit2:
    image: rabbitmq:4.1-management
    hostname: rabbit2
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit2
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5673:5672"
      - "15673:15672"
      - "15693:15692"
    depends_on:
      rabbit1:
        condition: service_healthy

  rabbit3:
    image: rabbitmq:4.1-management
    hostname: rabbit3
    environment:
      <<: *rabbit-env
      RABBITMQ_NODENAME: rabbit@rabbit3
    volumes:
      - rabbit3_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5674:5672"
      - "15674:15672"
      - "15694:15692"
    depends_on:
      rabbit1:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      rabbit1:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-capstone-admin-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  rabbit1_data:
  rabbit2_data:
  rabbit3_data:
  prometheus_data:
  grafana_data:
